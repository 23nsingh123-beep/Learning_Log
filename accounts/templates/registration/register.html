{% extends "Learning_Log/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
    <h2>Register an account</h2>
{% endblock page_header %}

{% block content %}

<form method="post" action="{% url 'accounts:register' %}">
    {% csrf_token %}

    {% bootstrap_form form %}

    {% bootstrap_button button_type="submit" content="Register" %}

</form>

{% endblock content %}
